const fh="'Fraunces',serif";
const fb="'Plus Jakarta Sans',sans-serif";

const TOTAL=19;

// Photo placeholder — now big and colorful
function Ph({label,h:ht,accent,radius}){
  accent=accent||C.o;
  return h("div",{style:{
    height:ht||220, borderRadius:radius||14, overflow:"hidden", flexShrink:0, position:"relative",
    background:"linear-gradient(135deg,"+accent+"22 0%,"+accent+"08 100%)",
    border:"2px dashed "+accent+"50",
    display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8
  }},
    h("div",{style:{fontSize:36}},"📸"),
    h("div",{style:{fontSize:12,fontFamily:fm,color:accent,fontWeight:700,textAlign:"center",padding:"0 12px",opacity:0.7,lineHeight:1.4}},label||"PHOTO")
  );
}

// Big section label pill
function SLabel({n,label,col}){
  col=col||C.o;
  return h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
    h("div",{style:{background:col,color:"#fff",fontFamily:fm,fontWeight:700,fontSize:10,padding:"3px 10px",borderRadius:100,letterSpacing:1}},"§"+n),
    h("div",{style:{fontFamily:fm,fontSize:10,color:C.ink3,letterSpacing:2,textTransform:"uppercase"}},label)
  );
}

// Decorative wavy line
function Wave({col}){
  col=col||C.o;
  return h("svg",{width:"80",height:"12",viewBox:"0 0 80 12",style:{display:"block",margin:"8px 0"}},
    h("path",{d:"M0 6 Q10 0 20 6 Q30 12 40 6 Q50 0 60 6 Q70 12 80 6",fill:"none",stroke:col,strokeWidth:"2.5",strokeLinecap:"round"})

}

// ── SLIDE 1: INDEX ──────────────────────────────────────────────
function SlideIndex({goTo}){
  const secs=[
    {n:1,icon:"🚀",title:"Hackathon 2025",sub:"6 teams · AI Agents · $3K prizes",i:3,col:C.o,bg:C.peach},
    {n:2,icon:"🍽️",title:"Culture Team",sub:"4 gatherings across 2 countries",i:4,col:C.t,bg:C.mint},
    {n:3,icon:"🌮",title:"Taco Winners",sub:"Jul · Aug · Sep champions",i:5,col:C.pk,bg:"#FFE0E8"},
    {n:4,icon:"👋",title:"New Hire",sub:"Welcome Leonel Zeballos",i:7,col:"#C47D00",bg:C.lemon},
    {n:5,icon:"✈️",title:"Team Updates",sub:"L2T reunion in Evanston",i:8,col:C.p,bg:"#EEE8FF"},
    {n:6,icon:"🌍",title:"Time Off",sub:"8 TangoCoders · 10+ destinations",i:9,col:C.g,bg:"#D8FAF1"},
  ];
  return h("div",{style:{flex:1,display:"flex",flexDirection:"column",background:C.bg,padding:"20px 28px 16px",gap:12}},
    h("div",{style:{display:"flex",alignItems:"baseline",gap:12}},
      h("div",{style:{fontFamily:fh,fontSize:36,fontWeight:900,color:C.ink,fontStyle:"italic"}},"What's inside"),
      h("div",{style:{fontFamily:fm,fontSize:10,color:C.ink3,letterSpacing:2}},"Q3 2025 · JULY–SEPTEMBER")
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,flex:1}},
      secs.map(s=>h("button",{key:s.n,onClick:()=>goTo(s.i),
        style:{
          background:s.bg,border:"2px solid "+s.col+"30",borderRadius:16,
          padding:"14px 16px",textAlign:"left",display:"flex",flexDirection:"column",gap:6,
          transition:"transform 0.15s,box-shadow 0.15s"

        onMouseEnter:e=>{e.currentTarget.style.transform="translateY(-3px)";e.currentTarget.style.boxShadow="0 8px 24px "+s.col+"28";},

        h("div",{style:{fontSize:28}},s.icon),

        h("div",{style:{fontFamily:fh,fontSize:18,fontWeight:900,color:C.ink,lineHeight:1.1}},s.title),
        h("div",{style:{fontFamily:fb,fontSize:11,color:C.ink2,lineHeight:1.4}},s.sub),

        h("div",{style:{marginTop:"auto",display:"flex",alignItems:"center",justifyContent:"space-between"}}),
        h("div",{style:{

          h("div",{style:{fontSize:18,color:s.col}},"→")

function App(){
  const [cur,setCur]=useState(0);
  const [fade,setFade]=useState(true);
  const [key,setKey]=useState(0);

  const goto=useCallback((idx)=>{
    if(idx<0||idx>=TOTAL)return;
    setFade(false);
    setTimeout(()=>{setCur(idx);setFade(true);setKey(k=>k+1);},140);
  },[]);

  useEffect(()=>{
    const onKey=(e)=>{
      if(e.key==="ArrowRight")setCur(c=>{const n=c<TOTAL-1?c+1:c;if(n!==c){setFade(false);setTimeout(()=>{setFade(true);setKey(k=>k+1);},140);}return n;});
      if(e.key==="ArrowLeft")setCur(c=>{const n=c>0?c-1:c;if(n!==c){setFade(false);setTimeout(()=>{setFade(true);setKey(k=>k+1);},140);}return n;});
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[]);

  const slides=[
    h(SlideCover,null),

    h(SlideTo,{person:"Flo V.",dest:"Miami — Solo Trip 🇺🇸",flag:"🇺🇸",col:"#06B6D4",facts:["Solo trip 💪","Rented a Camaro 🚗","100% recommend"],quote:"A super spontaneous trip! About a month before, I just booked flights to Miami for some relaxing beach days on my own. I rented a Camaro (I'm a big car lover!) and drove around to some really cool places. The beach was amazing, the weather was HOT. It was a week to unwind from the chaos of the year and just be thankful."}),
    h(SlideTo,{person:"Juan R.",dest:"Miami — Family Trip 🇺🇸",flag:"🇺🇸",col:"#10B981",facts:["Family of 5","Zoo · Seaquarium","Micro Center 🖥️"],quote:"Took the kids to the Zoo, the Seaquarium, the Safari, Miami Beach, and the Kids' Museum. Very, very HOT! We mountain people are not built for that heat. Best part for me: the newly opened Miami Micro Center — every PC builder's dream shop!"}),
    h(SlideTo,{person:"Agustin",dest:"Venice & Sicily 🇮🇹",flag:"🇮🇹",col:"#8B5CF6",facts:["2 months Europe","Siracusa · Taormina","Pasta every day 🍝"],quote:"Our almost two-month European journey began in Venice and Sicily. From Sicily, we traveled to Siracusa, Noto, Taormina, San Vito Lo Capo, and Cefalu. The weather was absolutely wonderful and we ate a lot — basically pasta! The colors and architecture of Sicily were truly special."}),
    h(SlideTo,{person:"Ash",dest:"Georgia & Turkey 🇬🇪🇹🇷",flag:"🇬🇪🇹🇷",col:"#F97316",photos:5,facts:["2 trips","Wine birthplace 🍷","Antalya ☀️","Birthday gift 🎁"],quote:"First trip: Georgia — amazing food, wine, beautiful nature, and welcoming people. Georgia is the first country to produce wine! Second trip: Turkey (Antalya) — my wife bought it as a birthday gift! I thought doing nothing for a week would bore me. I was SO wrong! Unlimited food, drinks, pool, sea, sun, spa, gym. I wanted to extend for one more week!"}),
    h(SlideClosing,null)
  ];

  const navBg=C.bg2;

  return h("div",{style:{width:"100%",height:"100vh",display:"flex",flexDirection:"column",background:C.bg,overflow:"hidden"}},
    // Top progress bar
    h("div",{style:{height:4,background:C.border,flexShrink:0}},
      h("div",{style:{height:"100%",background:"linear-gradient(90deg,"+C.o+","+C.t+")",width:((cur+1)/TOTAL*100)+"%",transition:"width 0.3s ease",borderRadius:"0 2px 2px 0"}})
    ),
    // Slide area
    h("div",{style:{flex:1,display:"flex",position:"relative",overflow:"hidden",opacity:fade?1:0,transition:"opacity 0.14s ease"},key},
      slides[cur],
      // Prev arrow
      cur>0&&h("button",{onClick:()=>goto(cur-1),style:{
        position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",
        background:C.bg2,border:"2px solid "+C.border,
        boxShadow:"0 4px 14px rgba(28,16,8,0.12)",
        color:C.ink,width:36,height:36,borderRadius:"50%",
        fontSize:18,zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"
      }},"‹"),
      // Next arrow
      cur<TOTAL-1&&h("button",{onClick:()=>goto(cur+1),style:{
        position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",
        background:C.o,border:"2px solid "+C.o,
        boxShadow:"0 4px 14px "+C.o+"40",
        color:"#fff",width:36,height:36,borderRadius:"50%",
        fontSize:18,zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"
      }},"›")
    ),
    // Bottom nav bar
    h("div",{style:{
      height:38,background:navBg,borderTop:"1.5px solid "+C.border,
      display:"flex",alignItems:"center",justifyContent:"space-between",
      padding:"0 14px",flexShrink:0
    }},
      h("button",{onClick:()=>goto(1),style:{
        background:"none",border:"1.5px solid "+C.o+"40",color:C.o,
        fontFamily:fm,fontSize:9,padding:"3px 10px",borderRadius:100,
        display:"flex",alignItems:"center",gap:4,fontWeight:700
      }},"⌂ INDEX"),
      h("div",{style:{display:"flex",gap:3,alignItems:"center"}},
        slides.map((_,i)=>h("button",{key:i,onClick:()=>goto(i),style:{
          width:i===cur?18:6,height:6,borderRadius:3,border:"none",padding:0,
          background:i===cur?C.o:C.border,
          transition:"all 0.2s",cursor:"pointer"
        }}))
      ),
      h("span",{style:{fontFamily:fm,fontSize:9,color:C.ink3}},(cur+1)+" / "+TOTAL+" · ← →")
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
</body>
</html>
